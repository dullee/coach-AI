<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Coach (prototype)</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e7e9ee; --muted:#9aa3b2; --accent:#e0b04a;
          --good:#5cc98a; --bad:#e2675f; --chip:#232834; }
  :root { color-scheme: dark; }   /* native controls (select lists, file input) drawn dark too */
  * { box-sizing: border-box; }
  select option { background: var(--panel); color: var(--text); }
  select option:disabled { color: #6b7280; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 12px 0 0; color:var(--accent); letter-spacing:.3px; }
  input, select, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  button { cursor:pointer; background:#262b36; }
  button.primary { background:var(--accent); color:#1b1606; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  main { display:grid; grid-template-columns: minmax(300px, 420px) 1fr; gap:20px; padding:20px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .muted { color:var(--muted); }
  .match { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--line); }
  .match:last-child { border-bottom:0; }
  .match .meta { font-size:13px; color:var(--muted); }
  .win { color:var(--good); } .loss { color:var(--bad); }
  .badge { font-size:11px; padding:2px 7px; border-radius:99px; background:var(--chip); color:var(--muted); margin-left:6px; }
  .badge.replay { color:var(--accent); }
  .progress div { color:var(--muted); font-size:14px; }
  .progress div:last-child { color:var(--text); }
  .prio { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:12px 0; }
  .prio h3 { margin:0 0 6px; font-size:16px; }
  .prio p { margin:6px 0; }
  .label { color:var(--accent); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.4px; margin-right:6px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { background:var(--chip); border-radius:6px; padding:3px 8px; font-size:12px; color:var(--muted); }
  .headline { font-size:17px; margin:8px 0 4px; }
  .focus { border-left:3px solid var(--accent); padding:8px 12px; background:#1d2029; border-radius:6px; }
  .footer { font-size:12px; color:var(--muted); margin-top:14px; }
  .warn { color:var(--bad); }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:10px; }
  .fb { display:flex; gap:6px; align-items:center; margin-top:10px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .fb button { padding:3px 10px; font-size:13px; }
  .fb button.on.up { background:#1f3b2b; border-color:var(--good); color:var(--good); }
  .fb button.on.down { background:#3b1f1f; border-color:var(--bad); color:var(--bad); }
  .fb input { flex:1; min-width:160px; font-size:13px; padding:4px 8px; }
  .since { border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:12px 0; background:#1b1e26; }
  .since h3 { margin:0 0 6px; font-size:14px; color:var(--accent); }
  .since li { margin:3px 0; font-size:14px; }
  .improved { color:var(--good); } .worse { color:var(--bad); }
  table.trend { border-collapse:collapse; width:100%; font-size:13px; margin-top:6px; }
  table.trend th, table.trend td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:right; white-space:nowrap; }
  table.trend th:first-child, table.trend td:first-child { text-align:left; white-space:normal; }
  .rec { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .dots span { display:inline-block; width:10px; height:10px; border-radius:50%; margin-left:3px; background:var(--chip); }
  .dots span.hit { background:var(--bad); }
  .scroll { overflow-x:auto; }
  .viz { --series-you:#3987e5; --series-alone:#d95926; --ref-line:#9aa3b2; --band:#2b3140; --grid:#262b35; --unknown:#8a93a3; }
  .viz-grid { display:grid; grid-template-columns: 3fr 2fr; gap:16px; margin:16px 0; align-items:start; }
  @media (max-width: 1100px) { .viz-grid { grid-template-columns: 1fr; } }
  .fig { border:1px solid var(--line); border-radius:10px; padding:12px; position:relative; }
  .fig h3 { margin:0 0 2px; font-size:14px; }
  .fig .sub { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:4px 0 6px; }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; border-radius:2px; }
  .legend i.dash { background:repeating-linear-gradient(90deg, var(--ref-line) 0 4px, transparent 4px 7px); }
  .legend i.band { height:10px; background:var(--band); }
  .legend i.dot { width:10px; height:10px; border-radius:50%; }
  .legend i.dia { width:9px; height:9px; transform:rotate(45deg); border-radius:1px; }
  .tip { position:absolute; pointer-events:none; background:#0f1115; border:1px solid var(--line); border-radius:8px;
         padding:6px 9px; font-size:12px; line-height:1.45; white-space:nowrap; display:none; z-index:5; }
  .tip b { color:var(--text); }
  svg text { fill:var(--muted); font-size:11px; }
  /* death replays: you / teammates / enemies (validated on the panel surface; enemies also differ by shape) */
  .viz { --rp-you:#3987e5; --rp-ally:#199e70; --rp-enemy:#d95926; }
  .rp-deaths { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px; }
  .rp-deaths button { padding:3px 9px; font-size:12px; }
  .rp-deaths button.on { border-color:var(--accent); color:var(--accent); }
  .rp-grid { display:grid; grid-template-columns:minmax(0, 3fr) minmax(220px, 2fr); gap:14px; align-items:start; }
  @media (max-width: 1100px) { .rp-grid { grid-template-columns:1fr; } }
  .rp-map { position:relative; }
  .rp-map svg { display:block; width:100%; max-width:560px; margin:auto; border-radius:8px; background:#0c0e12; }
  .rp-controls { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .rp-controls input[type=range] { flex:1; min-width:140px; accent-color:var(--accent); padding:0; }
  .rp-controls .time { font-variant-numeric:tabular-nums; font-size:13px; min-width:110px; }
  .rp-facts { font-size:13px; margin:0 0 8px 16px; padding:0; }
  .rp-facts li { margin:2px 0; }
  .rp-log { max-height:420px; overflow:auto; font-size:12px; border-top:1px solid var(--line); padding-top:6px; }
  .rp-log div { padding:3px 6px; border-radius:6px; color:var(--muted); cursor:pointer; display:flex; gap:8px; }
  .rp-log div .t { font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  .rp-log div.past { color:var(--text); }
  .rp-log div.now { background:var(--chip); }
  .rp-log i { display:inline-block; width:8px; height:8px; margin-top:5px; flex:none; }
  pre { white-space:pre-wrap; font-size:12px; color:var(--muted); max-height:400px; overflow:auto; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1>Deadlock Coach</h1>
  <label class="row">Account ID <input id="acc" size="12" placeholder="Steam friend code"></label>
  <label class="row">Model <select id="backend"></select></label>
  <button id="load" class="primary">Load my matches</button>
  <button id="progressBtn">My progress</button>
  <span class="muted" id="status"></span>
</header>
<main>
  <section class="panel">
    <h2 style="margin-top:0;font-size:16px">Your matches</h2>
    <div id="matches" class="muted">Enter your account ID and load your matches.</div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <form id="uploadForm" class="row">
      <input type="file" id="file" accept=".dem">
      <button type="submit">Upload replay</button>
    </form>
    <div class="muted" style="font-size:12px;margin-top:6px">
      Replays you download in Deadlock (match history &rarr; Download Replay) are found automatically.
    </div>
  </section>
  <section class="panel" id="out"><div class="muted">Pick a match to see its coaching report.</div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (r.status === 404 && body.detail === "Not Found")   // route missing: page is newer than the running server
    throw new Error("The app server is older than this page. Restart it (Ctrl+C, then python -m backend.app).");
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}

async function init() {
  $("acc").value = store.get("account_id") || "";
  const b = await api("/api/backends");
  const names = { claude: "Claude (Anthropic)", gemini: "Gemini (free tier)", pollinations: "Pollinations", local: "Local model" };
  const missing = { claude: "no key", gemini: "no key", pollinations: "no key", local: "not running" };
  $("backend").innerHTML = ["claude", "gemini", "pollinations", "local"].map(x =>
    `<option value="${x}" ${b.available.includes(x) ? "" : "disabled"}>${names[x]}${b.available.includes(x) ? (b.models && b.models[x] ? `: ${b.models[x]}` : "") : ` (${missing[x]})`}</option>`).join("");
  $("backend").value = store.get("backend") && b.available.includes(store.get("backend")) ? store.get("backend") : b.default;
  const q = new URLSearchParams(location.search);   // ?account=...&match=... opens a report directly
  if (q.get("account")) $("acc").value = q.get("account");
  if ($("acc").value) loadMatches();
  if (q.get("match")) showLatest(Number(q.get("match")));
}

async function loadMatches() {
  const acc = $("acc").value.trim();
  if (!/^\d+$/.test(acc)) { $("status").textContent = "Account ID must be a number"; return; }
  store.set("account_id", acc);
  $("status").textContent = "Loading matches...";
  try {
    const { matches } = await api(`/api/matches?account_id=${acc}`);
    $("status").textContent = "";
    if (!matches.length) { $("matches").innerHTML = "No matches found. Download a replay in Deadlock or upload one."; return; }
    $("matches").innerHTML = matches.map(m => `
      <div class="match">
        <div>
          <div><b>${esc(m.hero || "Unknown hero")}</b>
            ${m.result ? `<span class="${m.result}">${m.result}</span>` : ""}
            ${m.replay ? `<span class="badge replay">replay ${m.replay}</span>` : `<span class="badge">stats only</span>`}</div>
          <div class="meta">${esc(m.date || "date unknown")} · ${m.kda ? "KDA " + esc(m.kda) + " · " : ""}${m.duration ? esc(m.duration) + " · " : ""}#${m.match_id}</div>
        </div>
        <div class="row">
          ${m.has_report ? `<button onclick="showLatest(${m.match_id})">View</button>` : ""}
          <button class="primary" onclick="runReport(${m.match_id})">${m.has_report ? "Redo" : "Get report"}</button>
        </div>
      </div>`).join("");
  } catch (e) { $("status").textContent = e.message; }
}

let polling = null;
async function runReport(matchId) {
  const acc = Number($("acc").value.trim());
  store.set("backend", $("backend").value);
  $("out").innerHTML = `<h2 style="margin-top:0;font-size:16px">Match #${matchId}</h2><div class="progress" id="prog"><div>Starting...</div></div>`;
  try {
    const { job_id } = await api("/api/reports", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ account_id: acc, match_id: matchId, backend: $("backend").value }) });
    clearInterval(polling);
    const started = Date.now();
    polling = setInterval(async () => {
      const j = await api(`/api/jobs/${job_id}`);
      const secs = Math.round((Date.now() - started) / 1000);
      $("prog") && ($("prog").innerHTML = j.progress.map(p => `<div>${esc(p)}</div>`).join("") + `<div class="muted">${secs}s</div>`);
      if (j.status === "done") { clearInterval(polling); render(j.result); loadMatches(); }
      if (j.status === "error") { clearInterval(polling); $("out").innerHTML += `<p class="warn">${esc(j.error)}</p>`; }
    }, 1500);
  } catch (e) { $("out").innerHTML += `<p class="warn">${esc(e.message)}</p>`; }
}

async function showLatest(matchId) {
  try { render(await api(`/api/reports/latest?account_id=${$("acc").value.trim()}&match_id=${matchId}`)); }
  catch (e) { $("out").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
}

const fmt = (v, unit) => {
  if (v == null) return "";
  if (unit && unit.startsWith("share")) return Math.round(v * 100) + "%";
  if (unit === "seconds") return `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, "0")}`;
  return Math.abs(v) >= 10 ? Math.round(v) : Math.round(v * 10) / 10;
};

function evidenceChip(issue) {
  const e = issue.evidence;
  const vs = e.bracket_p50 != null ? ` vs ${fmt(e.bracket_p50, e.unit)} median` : "";
  return `<span class="chip">${esc(fmt(e.player_value, e.unit))} ${esc(e.unit.startsWith("share") || e.unit === "seconds" ? "" : e.unit)}${vs} · ${esc(e.window)}</span>`;
}

function render(res) {
  currentReport = res;
  const s = res.summary, r = res.report, p = s.player;
  const issues = Object.fromEntries((s.issues || []).map(i => [i.id, i]));
  const [k, d, a] = s.key_stats.kda;
  const dur = `${Math.floor(p.duration_s / 60)}:${String(p.duration_s % 60).padStart(2, "0")}`;
  let html = `<h2 style="margin-top:0;font-size:16px">${esc(p.hero)} · <span class="${p.result}">${p.result}</span> · ${dur} · KDA ${k}/${d}/${a}</h2>
    <div class="muted" style="font-size:13px">Compared with ${esc(p.rank_bracket)} players${p.bracket_basis === "estimated_from_stats" ? ` (you're unranked; this match's stats match ${esc(p.estimated_level)})` : ""} · ${s.analysis_level === "medium" ? "replay + stats" : "stats only (no replay)"}</div>`;
  if (!r) { $("out").innerHTML = html + `<p class="warn">No usable report: ${esc((res.problems || []).join("; "))}</p>`; return; }
  html += `<div id="followup"></div><p class="headline">${esc(r.headline)}</p>`;
  r.priorities.forEach((pr, n) => {
    const chips = pr.issue_ids.map(id => issues[id]).filter(Boolean).map(evidenceChip).join("");
    html += `<div class="prio"><h3>${n + 1}. ${esc(pr.title)}</h3>
      <p><span class="label">Why</span>${esc(pr.why)}</p>
      <p><span class="label">Fix</span>${esc(pr.how_to_fix)}</p>
      <p><span class="label">Drill</span>${esc(pr.drill)}</p>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      ${feedbackBar(res, n)}</div>`;
  });
  if (r.strengths.length) html += `<h3 style="font-size:15px">Strengths</h3><ul>${r.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  html += `<div id="visuals" class="viz"></div>`;
  html += `<div class="focus"><span class="label">Next match</span>${esc(r.next_match_focus)}</div>`;
  if (!res.valid) html += `<p class="warn">This report failed validation: ${esc((res.problems || []).join("; "))}</p>`;
  const cost = res.cost_usd == null ? "unknown" : "$" + Number(res.cost_usd).toFixed(4);
  html += `<div class="footer">${esc(res.backend)}:${esc(res.model)} · cost ${cost} · ${Math.round(res.latency_s || 0)}s</div>
    <details><summary>What the model saw (MatchSummary)</summary><pre>${esc(JSON.stringify(s, null, 1))}</pre></details>`;
  $("out").innerHTML = html;
  loadFollowup(s.match_id);
  loadVisuals(s.match_id);
}


const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const kfmt = (v) => v >= 1000 ? (Math.round(v / 100) / 10) + "k" : String(Math.round(v));
const lerp = (pts, x, key) => {          // linear interpolation over sorted {x, [key]} points
  if (!pts.length || x < pts[0].x || x > pts[pts.length - 1].x) return null;
  for (let i = 1; i < pts.length; i++) if (x <= pts[i].x) {
    const a = pts[i - 1], b = pts[i], f = b.x === a.x ? 0 : (x - a.x) / (b.x - a.x);
    return a[key] + (b[key] - a[key]) * f;
  }
  return pts[pts.length - 1][key];
};
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p) * p; }

async function loadVisuals(matchId) {
  try {
    const v = await api(`/api/visuals?account_id=${$("acc").value.trim()}&match_id=${matchId}`);
    if (!$("visuals")) return;
    $("visuals").innerHTML = `<div class="viz-grid"><div class="fig" id="soulsFig"></div><div class="fig" id="mapFig"></div></div>`;
    soulsChart($("soulsFig"), v);
    deathMap($("mapFig"), v);
    if (v.has_replay && v.deaths.length) {
      $("visuals").insertAdjacentHTML("beforeend", `<div class="fig" id="replayFig"><h3>Death replays</h3><div class="sub">Loading...</div></div>`);
      api(`/api/death_replays?account_id=${$("acc").value.trim()}&match_id=${matchId}`)
        .then(d => deathReplays($("replayFig"), d))
        .catch(e => { if ($("replayFig")) $("replayFig").innerHTML = `<h3>Death replays</h3><p class="muted">${esc(e.message)}</p>`; });
    }
  } catch (e) { if ($("visuals")) $("visuals").innerHTML = `<p class="muted" style="font-size:12px">Charts unavailable: ${esc(e.message)}</p>`; }
}

function soulsChart(el, v) {
  const s = v.souls, you = s.player.map(p => ({ x: p.t, y: p.souls }));
  const dur = s.duration_s;
  const band = s.bracket.filter(p => p.minute * 60 <= dur + 30).map(p => ({ x: p.minute * 60, lo: p.p25, mid: p.p50, hi: p.p75 }));
  const W = 640, H = 270, m = { l: 46, r: 64, t: 12, b: 28 };
  const maxY = niceMax(Math.max(1, ...you.map(p => p.y), ...band.map(p => p.hi)));
  const X = (x) => m.l + (x / dur) * (W - m.l - m.r), Y = (y) => H - m.b - (y / maxY) * (H - m.t - m.b);
  const line = (pts, key) => pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Souls over time">`;
  for (let i = 0; i <= 4; i++) {           // recessive horizontal grid + y labels
    const yv = maxY * i / 4, y = Y(yv);
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
            <text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${kfmt(yv)}</text>`;
  }
  for (let t = 0; t <= dur; t += 300) svg += `<text x="${X(t)}" y="${H - 8}" text-anchor="middle">${t / 60}:00</text>`;
  if (band.length > 1) {
    svg += `<path d="${line(band, "hi")}L${band.slice().reverse().map(p => `${X(p.x).toFixed(1)},${Y(p.lo).toFixed(1)}`).join("L")}Z" fill="var(--band)" stroke="none"/>`;
    svg += `<path d="${line(band, "mid")}" fill="none" stroke="var(--ref-line)" stroke-width="2" stroke-dasharray="5 4"/>`;
    const lastB = band[band.length - 1];
    svg += `<text x="${X(lastB.x) + 6}" y="${Y(lastB.mid) + 4}">Median</text>`;
  }
  svg += `<path d="${line(you, "y")}" fill="none" stroke="var(--series-you)" stroke-width="2" stroke-linejoin="round"/>`;
  svg += you.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="var(--series-you)" stroke="var(--panel)" stroke-width="2"/>`).join("");
  const lastY = you[you.length - 1];
  if (lastY) svg += `<text x="${X(lastY.x) + 6}" y="${Y(lastY.y) - 6}" style="fill:var(--text)">You</text>`;
  svg += `<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
          <rect id="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg>`;
  el.innerHTML = `<h3>Souls over time</h3>
    <div class="sub">Your net worth vs ${esc(s.bracket_scope || "the bracket")} (dashed: median; shaded: middle half of players)</div>
    <div class="legend"><span><i style="background:var(--series-you)"></i>You</span>
      ${band.length ? `<span><i class="dash"></i>Median</span><span><i class="band"></i>25th-75th percentile</span>` : `<span>No benchmark curve for this hero/bracket</span>`}</div>
    ${svg}<div class="tip" id="soulsTip"></div>
    <details><summary>Show as table</summary><table class="trend"><tr><th>Time</th><th>You</th><th>Median</th><th>25th-75th</th></tr>${

function deathMap(el, v) {

    d.kills.filter(x => x.t <= cur).forEach(x => {
      const t = d.tracks.find(tr => tr.slot === x.victim); if (!t) return;
      const fi = Math.max(0, Math.round(frameOf(x.t)) - 1), px = t.x[fi], py = t.y[fi]; if (px == null) return;
      const [mx, my] = P(px, py), c = 2.2 * k;
      marks += `<path d="M${mx - c},${my - c}L${mx + c},${my + c}M${mx + c},${my - c}L${mx - c},${my + c}" stroke="${colorOf(x.victim)}" stroke-width="${0.8 * k}" stroke-linecap="round"><title>${esc(name(x.victim))} died</title></path>`;
    });
    nodes.marks.innerHTML = marks;
    el.querySelector("#rpSlider").value = cur;
    el.querySelector("#rpTime").textContent = `${sec(cur)} · ${mmss(Math.max(0, d.t + cur))}`;
    el.querySelectorAll("#rpLog [data-i]").forEach(n => {
      const g = log[Number(n.dataset.i)], past = g.t <= cur;
      n.classList.toggle("past", past);
      n.classList.toggle("now", past && cur - g.end < 0.6);
    });
    const logEl = el.querySelector("#rpLog"), lastPast = [...logEl.querySelectorAll(".past")].pop();
    if (lastPast) {                        // keep the latest event in view
      const top = lastPast.offsetTop - logEl.offsetTop;
      if (top < logEl.scrollTop || top > logEl.scrollTop + logEl.clientHeight - 30) logEl.scrollTop = top - logEl.clientHeight / 2;
    }
  }

  function seek(t) { cur = Math.max(T0, Math.min(T1, t)); draw(); }
  function setPlaying(on) {
    playing = on;
    el.querySelector("#rpPlay").innerHTML = on ? "&#10074;&#10074; Pause" : "&#9654; Play";
    cancelAnimationFrame(raf);
    if (on) { if (cur >= T1) cur = T0; last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function tick(now) {
    if (!document.body.contains(el)) return;          // report was replaced
    cur += (now - last) / 1000 * speed; last = now;
    if (cur >= T1) { cur = T1; draw(); setPlaying(false); return; }
    draw(); raf = requestAnimationFrame(tick);
  }
  function select(i, autoplay) {
    d = data.deaths[i];
    el.querySelectorAll("#rpDeaths button").forEach(b => b.classList.toggle("on", Number(b.dataset.i) === i));
    setPlaying(false); build(); seek(T0);
    if (autoplay && !reduced) setPlaying(true);
  }
  el.querySelectorAll("#rpDeaths button").forEach(b => b.onclick = () => select(Number(b.dataset.i), true));
  el.querySelector("#rpPlay").onclick = () => setPlaying(!playing);
  el.querySelector("#rpSlider").oninput = (e) => { setPlaying(false); seek(Number(e.target.value)); };
  el.querySelector("#rpSpeed").onchange = (e) => { speed = Number(e.target.value); };
  window.selectReplayDeath = (t) => {             // from the death map: pick the death closest in time
    let best = 0;
    data.deaths.forEach((x, i) => { if (Math.abs(x.t - t) < Math.abs(data.deaths[best].t - t)) best = i; });
    select(best, true); el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
  };
  select(0, false);
}

function feedbackBar(res, n) {
  if (res.report_id == null) return "";
  const f = (res.feedback || {})[String(n)] || {};
  const up = f.rating === 1 ? "null" : "1", down = f.rating === -1 ? "null" : "-1";
  return `<div class="fb" id="fb-${n}">Useful?
    <button class="up ${f.rating === 1 ? "on" : ""}" onclick="rate(${res.report_id}, ${n}, ${up})">&#128077; Yes</button>
    <button class="down ${f.rating === -1 ? "on" : ""}" onclick="rate(${res.report_id}, ${n}, ${down})">&#128078; No</button>
    <input id="fbc-${n}" placeholder="Optional comment (press Enter to save)" value="${esc(f.comment || "")}"
      onkeydown="if (event.key === 'Enter') rate(${res.report_id}, ${n}, undefined)">
    <span id="fbs-${n}"></span></div>`;
}

let currentReport = null;
async function rate(reportId, n, rating) {
  const prev = ((currentReport && currentReport.feedback) || {})[String(n)] || {};
  const body = { report_id: reportId, priority_index: n,
                 rating: rating === undefined ? (prev.rating ?? null) : rating,
                 comment: $(`fbc-${n}`).value };
  try {
    const { feedback } = await api("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
                                                      body: JSON.stringify(body) });
    currentReport.feedback = feedback;
    $(`fb-${n}`).outerHTML = feedbackBar(currentReport, n);
    $(`fbs-${n}`).textContent = "saved";
  } catch (e) { $(`fbs-${n}`).textContent = e.message; }
}

const fmtStat = (v, unit) => v == null ? "-" : (unit === "deaths/10 min" ? Math.round(v * 10) / 10 : fmt(v, unit));

async function loadFollowup(matchId) {
  try {
    const { follow_up: f } = await api(`/api/followup?account_id=${$("acc").value.trim()}&match_id=${matchId}`);
    if (!f || !$("followup")) return;
    const good = new Set(["improved", "not detected this match"]), bad = new Set(["worse", "still detected"]);
    const rows = f.items.map(i => {
      const cls = good.has(i.status) ? "improved" : bad.has(i.status) ? "worse" : "muted";
      const nums = i.before != null
        ? `${esc(fmtStat(i.before, i.unit))} &rarr; ${esc(fmtStat(i.after, i.unit))}` +
          (i.median != null ? ` <span class="muted">(median ${esc(fmtStat(i.median, i.unit))})</span>` : "")
        : "";
      return `<li>${esc(i.label)}: ${nums} <span class="${cls}">${esc(i.status)}</span></li>`;
    }).join("");
    $("followup").innerHTML = `<div class="since"><h3>Since your last coached match (#${f.previous_match_id}, ${esc(f.previous_hero)}${f.same_hero ? "" : ", different hero"})</h3>
      <div style="font-size:13px" class="muted">Last focus: ${esc(f.previous_focus)}</div>
      <ul style="margin:6px 0 0 18px;padding:0">${rows}</ul></div>`;
  } catch (e) { /* the follow-up box is optional */ }
}

async function showProgress() {
  const acc = $("acc").value.trim();
  if (!/^\d+$/.test(acc)) { $("status").textContent = "Enter your account ID first"; return; }
  store.set("account_id", acc);
  $("out").innerHTML = `<h2 style="margin-top:0;font-size:16px">Your progress</h2>
    <div class="muted">Analysing your recent matches (the first time takes a few seconds)...</div>`;
  try {
    const p = await api(`/api/progress?account_id=${acc}&last_n=10`);
    const ms = p.matches;
    if (!ms.length) { $("out").innerHTML = `<p class="muted">No analysable matches yet.</p>`; return; }
    let html = `<h2 style="margin-top:0;font-size:16px">Your progress: last ${ms.length} matches</h2>
      <h3 style="font-size:15px;margin-bottom:4px">Recurring issues</h3>
      <div class="muted" style="font-size:12px">Dots: oldest match on the left, newest on the right; red = detected.</div>`;
    html += p.recurring.map(r => `<div class="rec"><div><b>${esc(r.label)}</b>
        <div class="muted" style="font-size:12px">${r.count} of ${r.of} matches${r.latest_streak > 1 ? ` · last ${r.latest_streak} in a row` : ""}</div></div>
        <div class="dots">${ms.map(m => `<span class="${m.issues.includes(r.id) ? "hit" : ""}" title="#${m.match_id} ${esc(m.hero)}"></span>`).join("")}</div>
      </div>`).join("") || `<p class="muted">No recurring issues.</p>`;
    html += `<h3 style="font-size:15px;margin:16px 0 4px">Your stats, match by match</h3><div class="scroll"><table class="trend"><tr><th></th>` +
      ms.map(m => `<th title="#${m.match_id}">${esc(m.hero)}<br><span class="${m.result}">${esc(m.result)}</span><br><span class="muted">${esc(m.date || "")}</span></th>`).join("") + `</tr>`;
    for (const tr of p.trends) {
      const vals = tr.values;
      html += `<tr><td>${esc(tr.label)}<br><span class="muted">${esc(tr.window)}</span></td>` + vals.map((v, i) => {
        const prev = vals.slice(0, i).filter(x => x != null);
        const avg = prev.length ? prev.reduce((a, b) => a + b, 0) / prev.length : null;
        const better = v != null && avg != null && (tr.higher_is_better ? v > avg : v < avg);
        const worse = v != null && avg != null && (tr.higher_is_better ? v < avg : v > avg);
        return `<td class="${better ? "improved" : worse ? "worse" : ""}">${esc(fmtStat(v, tr.unit))}</td>`;
      }).join("") + `</tr>`;
    }
    html += `</table></div><div class="muted" style="font-size:12px;margin-top:6px">Green / red: better / worse than your average over the matches before it.</div>`;
    $("out").innerHTML = html;
  } catch (e) { $("out").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
}

$("progressBtn").onclick = showProgress;
$("load").onclick = loadMatches;
$("acc").addEventListener("keydown", e => { if (e.key === "Enter") loadMatches(); });
$("backend").onchange = () => store.set("backend", $("backend").value);
$("uploadForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = $("file").files[0], acc = $("acc").value.trim();
  if (!f || !acc) { $("status").textContent = "Choose a .dem file and enter your account ID first"; return; }
  $("status").textContent = `Uploading ${f.name} (${Math.round(f.size / 1e6)} MB)...`;
  const fd = new FormData(); fd.append("file", f); fd.append("account_id", acc);
  try {
    const { match_id } = await api("/api/upload", { method: "POST", body: fd });
    $("status").textContent = `Uploaded match #${match_id}`;
    await loadMatches(); runReport(match_id);
  } catch (err) { $("status").textContent = err.message; }
};
init();
</script>
